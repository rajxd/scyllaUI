name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install server dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --coverage --coverageReporters=text-summary
        env:
          JWT_SECRET: ci-jwt-secret-placeholder-only-used-in-tests
          ENCRYPTION_KEY: ci-encryption-key-placeholder-only-used-in-tests
